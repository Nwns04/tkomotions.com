services:
  - type: web
    name: tkomotions
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://tkomotions.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: DEMO_NOTIFICATION_EMAIL
        sync: false
      - key: BUSINESS_TIME_ZONE
        value: Africa/Lagos
      - key: ENSURE_DATABASE_INDEXES
        value: "true"
      - key: AI_PRIMARY_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDER
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_REQUEST_TIMEOUT_MS
        value: 30000
      - key: AI_MAX_RETRIES_PER_PROVIDER
        value: 1
      # TKO AI Sales Engine uses its own provider abstraction. These keys stay
      # server-side and do not affect the Finance quotation assistant above.
      - key: AI_PROVIDER
        value: groq
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_TIMEOUT_MS
        value: 20000
