services:
  - type: web
    name: tkomotions
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://tkomotions.com
      - key: BUSINESS_TIME_ZONE
        value: Africa/Lagos
      - key: ENSURE_DATABASE_INDEXES
        value: "true"
      - key: AI_PRIMARY_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDER
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_REQUEST_TIMEOUT_MS
        value: 30000
      - key: AI_MAX_RETRIES_PER_PROVIDER
        value: 1
